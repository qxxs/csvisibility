[project]
name = "rocket-propulsion-simulator"
version = "2.0.0"
description = "A dependency-free vertical rocket propulsion simulator"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "anthroptic"}
]
keywords = ["rocket", "propulsion", "simulation", "physics", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
rocket-sim = "rocket_sim:main"

[tool.setuptools]
py-modules = ["rocket_sim"]

[tool.setuptools.packages.find]
include = ["rocket_simulator*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
